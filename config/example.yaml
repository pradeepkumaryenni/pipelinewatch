# PipelineWatch configuration (sample values that match the bundled simulator).
#
# databricks_workspaces: Databricks webhooks carry a workspace id, not an environment name.
#   Map each workspace id to its environment and host so alerts say "prod" and link to the run.
# pipeline_tiers: business impact per pipeline or job (1 = revenue or regulatory impact).
#   Anything not listed is tier 3.

databricks_workspaces:
  "1234567890123456":
    environment: prod
    host: https://adb-1234567890123456.7.azuredatabricks.net
  "2345678901234567":
    environment: dev
    host: https://adb-2345678901234567.7.azuredatabricks.net

pipeline_tiers:
  nightly_sales_etl: 1
  pl_load_finance_gl: 1
  gold.sales_daily: 1
  pl_ingest_crm_accounts: 2
  customer_360_refresh: 2
  pl_refresh_marketing_lookup: 3

# Repeats of the same problem (same source, environment, pipeline and event type) inside this window are
# suppressed unless they are more severe than what was already sent. A recovery closes the window.
dedup_window_minutes: 15

# Which decisions notify which channels. A channel only sends when its secrets are set in the
# environment (see README). DIGEST alerts are stored for the daily digest (v0.3).
notifications:
  PAGE: [slack, teams, telegram]
  NOTIFY: [slack, teams]
  RESOLVE: [slack, teams, telegram]
