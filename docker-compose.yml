# Local Postgres for PipelineWatch.
#   docker compose up -d
#   PIPELINEWATCH_DATABASE_URL=postgresql://pipelinewatch:pipelinewatch@localhost:5432/pipelinewatch
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pipelinewatch
      POSTGRES_PASSWORD: pipelinewatch
      POSTGRES_DB: pipelinewatch
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pipelinewatch"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
